# Render blueprint — dash-email docs (single web service, docker runtime).
# Auto-deploys on push to main. Serves the component documentation + the
# /email-builder app, fronted by https://email.2plot.dev.
#
# FIRST DEPLOY CHECKLIST:
#   1. Create the Blueprint from this repo; fill every `sync: false` secret in
#      the dashboard (values live in the local .env — NEVER committed).
#   2. GOOGLE_API_KEY powers AI generation in /email-builder; RESEND_API_KEY
#      powers sending. Both are optional — the docs pages work without them,
#      the builder degrades gracefully.
#   3. CROSS_APP_WEBHOOK_SECRET is the shared 2plot.ai network secret — set
#      it to the same value every other satellite uses, or this app's traffic
#      never reaches the /traffic hub (see lib/satellite_reporter.py).
#   4. DNS: point `email.2plot.dev` at this service with a CNAME to the
#      Render hostname Render shows once the domain below is accepted. Until
#      that resolves, the service is only reachable on *.onrender.com — and
#      every canonical URL will already be advertising email.2plot.dev, which
#      is intentional (see note on DASH_EMAIL_BASE_URL below).
#   5. Register the satellite with the network — three separate places, each
#      of which fails silently if missed:
#        a. 2plot.ai env `PULSE_POLL_TARGETS` += `email=https://email.2plot.dev/healthz`
#        b. 2plotai `lib/network_directory.py` — add the `email` key so
#           /traffic labels the series instead of showing a bare slug
#        c. the ad network keys off AD_APP_ID (`dash-email`) separately
#   6. LINK ENV GROUPS A/B/C in the dashboard (a Blueprint cannot do this):
#        A `2plot-network-shared`      — CROSS_APP_WEBHOOK_SECRET,
#          ADMIN_EMAILS, ANALYTICS_GEO_LOOKUP, AD_SERVER_URL,
#          NETWORK_BULLETIN_URL, LLMS_SMALL_TIER, LLMS_FULL_TIER
#        B `2plot-satellite-reporting` — SATELLITE_TRAFFIC_URL, the report/
#          presence cadence, TRAFFIC_ANALYTICS_FILE, PAGE_VISIBILITY_FILE
#        C `2plot-clerk-satellite`     — the full CLERK_* block incl.
#          CLERK_SATELLITE_SIGN_IN_REDIRECT
#      A service-level var with the same name OVERRIDES the group value, so
#      the entries below that duplicate a group are documentation + local-dev
#      defaults; on the live service the groups are the source of truth
#      (delete same-value service copies on the next shadow sweep). The four
#      per-service identity vars stay HERE by design: SATELLITE_APP_KEY,
#      APP_BASE_URL, SESSION_SECRET (unique!), AD_APP_ID.
services:
  - type: web
    name: dash-email-docs
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    # Render provisions the certificate once the CNAME resolves. The
    # *.onrender.com hostname keeps working and is NOT the canonical origin —
    # every page advertises email.2plot.dev, so hits on the Render hostname
    # consolidate onto the custom domain rather than competing with it.
    domains:
      - email.2plot.dev
    envVars:
      # Drives every absolute URL the app emits: <link rel="canonical">,
      # og:url, sitemap.xml, robots.txt and the llms.txt links. It matches
      # DEFAULT_BASE_URL in lib/constants.py, so this entry is belt-and-braces
      # — set it explicitly here so a preview environment can override it
      # without editing code.
      #
      # APP_BASE_URL is the network-wide name (the boilerplate, leaflet and the
      # hub all read it) and wins; DASH_EMAIL_BASE_URL is this repo's original
      # name, kept because it has been set on this service since the first
      # deploy and removing it from only one of the two places is how a host
      # starts advertising the wrong canonical origin.
      - key: APP_BASE_URL
        value: https://email.2plot.dev
      - key: DASH_EMAIL_BASE_URL
        value: https://email.2plot.dev
      - key: WEB_WORKERS
        value: "1"
      # --- Secrets (set in the Render dashboard) ---
      - key: GOOGLE_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CROSS_APP_WEBHOOK_SECRET
        sync: false
      # This app's 2plot network-directory key. ONE id on every hub surface:
      # SATELLITE_APP_KEY labels the /traffic series, AD_APP_ID keys the ad
      # server's impression and click rows, and lib/bulletin.py derives its
      # `app_id` from the first of the two. The ad rows were logged under
      # "dash-email" before this pass; the hub folds legacy spellings at
      # ingest (`canonical_app_id`), so history is not orphaned, but every new
      # row lands on "email" and /admin/ad-analytics stops showing one host
      # twice.
      - key: SATELLITE_APP_KEY
        value: email
      - key: AD_APP_ID
        value: email
      # The hub's announcement feed, rendered in this site's llms.txt viewer
      # header. Opt-in — unset means the feature is simply off (lib/bulletin).
      - key: NETWORK_BULLETIN_URL
        value: https://2plot.dev/api/network/bulletin
      # Access tiers for the tiered corpus documents (/llms-small.txt,
      # /llms-full.txt — dash-improve-my-llms >= 2.4.0). Deliberately set to
      # the default here so every deploy SEES the knob: the 402 experiment
      # tightens the full corpus by flipping this to `auth`, per satellite,
      # with no code change. See .env.example for the tier values.
      - key: LLMS_SMALL_TIER
        value: public
      - key: LLMS_FULL_TIER
        value: public
      # 15 minutes, not the code default of hourly: the fleet is on paid
      # instances and the hub board reads near-real-time. The live
      # "active now" number rides the separate presence beacon
      # (SATELLITE_PRESENCE_INTERVAL_S, default 60s, 0 disables) — this knob
      # only paces the daily rollup. Arrives via group B on the live service.
      - key: SATELLITE_REPORT_INTERVAL_S
        value: "900"

      # --- The interactive gate (lib/gate_layouts.py) ---------------------
      # THE per-host gate switch: flip to `auth` and every docs page whose
      # frontmatter doesn't pin a tier shows the sign-in card to anonymous
      # browsers. Rollback is flipping it back — env only, no code revert.
      # Funnel pages (/, /email-builder, the corpus pseudo-paths) are pinned
      # public in code and never inherit this. Declared EXPLICITLY at the
      # dark-ship value even though unset means the same thing: the
      # declared-vs-live env diff flags its absence as drift forever, and
      # the flip becomes a value edit on an existing var instead of a
      # var-add (wave posture, 2026-08-21).
      - key: PAGE_DEFAULT_TIER
        value: public
      # The second axis, and the phase-4 agent flip: while "1", machine
      # surfaces (llms.txt family, crawler HTML, the prerender) stay open on
      # auth pages so the crawl-demand window keeps measuring. "0" gates
      # anonymous machine fetches too (keyed agents still pass). Do not flip
      # before the window closes.
      - key: LLMS_PUBLIC_DEFAULT
        value: "1"

      # --- Clerk satellite auth (lib/auth.py) -----------------------------
      # All OPTIONAL: absent, the site runs fully public and admin surfaces
      # fail CLOSED (lib.auth.admin_access_open). On the live service this
      # whole block arrives via env group C (`2plot-clerk-satellite`); the
      # entries here document the shape for a Blueprint-only deploy.
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      # The 2plot.ai PRIMARY on its production Clerk instance (Account
      # Portal + Frontend API custom domains — not *.accounts.dev).
      - key: CLERK_SIGN_IN_URL
        value: https://accounts.2plot.ai/sign-in
      - key: CLERK_SIGN_UP_URL
        value: https://accounts.2plot.ai/sign-up
      # THE RETURN TRIP — the stage-5 blocker leaflet's pilot surfaced
      # (2026-08-21 handoff). Unset, buildSatelliteRedirect() returns null,
      # every sign-in path falls through to the Clerk Account Portal, the
      # hub's return machinery never runs, and the user authenticates
      # successfully and STAYS on the primary — no error anywhere.
      # A DESTINATION, not a flag: the value is concatenated as
      # `<value>?returnTo=<here>`, so `true` or a bare host resolves against
      # THIS site and the button 404s — worse than unset. lib/auth.py warns
      # at boot for both mistakes; the absence of those warnings is the
      # deploy acceptance check.
      - key: CLERK_SATELLITE_SIGN_IN_REDIRECT
        value: https://2plot.ai/onboarding
      # REQUIRED in satellite mode; a production custom-domain instance
      # cannot derive it from CLERK_SIGN_IN_URL.
      - key: CLERK_FRONTEND_API
        value: https://clerk.2plot.ai
      # The REGISTERED SATELLITE DOMAIN — deliberately NOT the host this app
      # is served on. Every *.2plot.dev docs host is an ALLOWED SUBDOMAIN of
      # the 2plot.dev satellite; clerk.email.2plot.dev is NXDOMAIN and
      # setting it here hangs sign-in. Session cookies are scoped to
      # .2plot.dev, which is exactly what the allowlist enables.
      - key: CLERK_SATELLITE_DOMAIN
        value: 2plot.dev
      - key: CLERK_IS_SATELLITE
        value: "true"
      # Signs the session + __dca_identity cookies. UNIQUE per service —
      # never grouped. Without it dash-clerk-auth falls back to a PUBLIC dev
      # default string.
      - key: SESSION_SECRET
        generateValue: true
      # Admin allowlist for admin-tier pages (lib.auth.is_admin_user).
      - key: ADMIN_EMAILS
        sync: false

      # The hub takes the LAST report for a given (app, date). On an ephemeral
      # filesystem a mid-day deploy wipes the ledger and the next hourly report
      # overwrites the day's real total with whatever accrued since the
      # restart. The disk below is what stops that.
      - key: TRAFFIC_ANALYTICS_FILE
        value: /var/data/visitor_analytics.json

      # Control-board overrides (/admin/control-board) persist here — on the
      # same disk, so toggles survive deploys. A Blueprint env row applies
      # only on a sync, so the value that matters is group B's on the live
      # service; the boot prints a [visibility] WARNING when the variable is
      # missing OR when /var/data is not actually a mounted disk. The
      # absence of that warning in a deploy log is the acceptance check.
      - key: PAGE_VISIBILITY_FILE
        value: /var/data/page_visibility.json

    disk:
      name: analytics
      mountPath: /var/data
      sizeGB: 1
