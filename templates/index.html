<!DOCTYPE html>
<html lang="en">
<head>
    <!-- CHARSET MUST BE FIRST.
         The HTML spec requires the encoding declaration to appear entirely
         within the first 1024 bytes of the document. Dash emits its own
         charset meta in the placeholder block below, but that block comes
         *after* the per-page description/og/twitter tags register_page()
         prepends — which on this site already reaches byte 1008 on
         /components/email-structure. One longer page description and it goes
         non-conforming. Declaring it here pins it near byte 60 whatever Dash
         adds later; the duplicate is deliberate and harmless, the first
         declaration wins.

         NEVER NAME A DASH PLACEHOLDER INSIDE A COMMENT. Dash substitutes them
         by plain string replacement over the whole template, comments
         included. This comment used to spell the metas placeholder out, so
         every response carried the ENTIRE per-page meta block twice — once
         here, inert inside the comment, and once where it belongs. Live and
         invisible in a browser; a scraper reading the raw HTML sees two
         og:image tags and picks one. That is the "two empty og:image tags"
         this host was measured with on 2026-08-01. -->
    <meta charset="utf-8">

    <!-- Dash emits, per page, from register_page(): description, og:title,
         og:type, og:description, og:image and the full twitter:* set. Do NOT
         restate any of those below — a second, site-level copy is strictly
         worse than the page-level one, and search engines pick between
         duplicates arbitrarily. -->
    {%metas%}
    <title>{%title%}</title>
    <!-- The favicon placeholder below emits exactly ONE tag: a cache-busted
         <link rel="icon"> for the favicon.ico it finds anywhere under assets/
         (Dash walks the tree, so assets/favicon/favicon.ico is picked up).
         Do not add a second hand-written .ico link -- that is a duplicate.
         Everything Dash does NOT emit is listed after it: the PNG size
         variants, the iOS touch icon and the manifest.

         Do not write the placeholder's name into a comment either; Dash
         string-substitutes it wherever it appears, comments included. -->
    {%favicon%}
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon/android-chrome-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/assets/favicon/site.webmanifest">

    <!-- Two theme-colors, not one: the appshell follows
         prefers-color-scheme (components/appshell.py), so a single value would
         paint the mobile browser chrome wrong for half of visitors. These are
         the Mantine body backgrounds for each scheme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1b1e">

    {%css%}

    <!-- ========================================================================
         SITE-LEVEL TAGS DASH DOES NOT EMIT
         ========================================================================
         ONE RULE, and it is the whole reason this block is short: declare only
         what Dash does NOT emit itself.

         `dash.register_page()` makes Dash generate `description`, `og:type`,
         `og:title`, `og:description`, `og:image` and the full `twitter:*` set
         on EVERY request, per page (see `_page_meta_tags` in dash/_pages.py).
         Declaring them here as well produces two of each — and the static copy
         describes the SITE while Dash's describes the PAGE, so the duplicate is
         both redundant and less accurate. Which one a scraper honours is not
         defined; in practice the later tag wins.

         tests/test_social_card.py asserts the counts in both directions. -->
    <meta name="keywords" content="dash, plotly, email, react-email, email templates, python, components, newsletter, transactional email">
    <meta name="author" content="Pip Install Python LLC">
    <meta property="og:site_name" content="dash-email — email components for Dash">
    <meta property="og:locale" content="en_US">

    <!-- OG URL. Genuinely absent from Dash's per-page set, so it belongs here.
         The origin is substituted from lib/constants.py at startup; the
         client-side script below re-points it on SPA navigation. -->
    <meta property="og:url" content="__CANONICAL_ORIGIN__/">

    <!-- THE SOCIAL CARD — and note that the image URL itself is NOT here.
         Deliberately.

         Dash emits `og:image` and `twitter:image` for every page from
         `register_page(image_url=...)`, which `lib/constants.OG_IMAGE_URL` now
         supplies (pages/home.py, pages/email_builder.py, pages/markdown.py).
         A static copy here would make TWO of each and let the scraper choose.
         Before this pass no page passed `image_url` at all, so Dash shipped
         `og:image=""` on every one of them — an EMPTY tag, which unfurls worse
         than a missing one because scrapers treat the empty value as the
         declared image and render a blank card.

         What stays are the auxiliaries Dash never emits. Keep them in step
         with lib/constants.OG_IMAGE_* — a width/height that disagrees with the
         real file is worse than declaring none, because the platform reserves
         that box and crops into it. scripts/smoke_live.py reads the IHDR chunk
         of the actual CDN object after every deploy and compares.

         secure_url is the https duplicate Facebook still reads; type saves the
         scraper a HEAD request to learn the format. -->
    <meta property="og:image:secure_url" content="https://cdn.2plot.ai/github_assets/email.2plot.dev.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="dash-email — email components for Dash">

    <!-- Same rule as above: Dash emits twitter:card, twitter:url,
         twitter:title, twitter:description and twitter:image per page. Only
         the alt text is left, because Dash omits it. -->
    <meta name="twitter:image:alt" content="dash-email — email components for Dash">

    <!-- Keeps canonical / og:url / twitter:url correct across CLIENT-SIDE
         navigation only. dash-improve-my-llms 2.3.3 emits all three
         server-side per route (tagged data-dimll-prerender), so the raw
         document is already right — this exists solely because Dash routes
         without firing a navigation event, which leaves those tags describing
         the page the visitor first landed on.

         UPDATE-ONLY, deliberately: it never creates a tag the server did not
         send. Creating one would put a second <link rel="canonical"> on the
         page whenever the package's prerender path did not run, and two
         canonicals is worse than a stale one — engines may ignore both.
         An unknown path therefore stays canonical-less, which is correct.

         CANONICAL_ORIGIN is substituted from lib/constants.py at startup, not
         read from location.origin, so hits on the *.onrender.com hostname
         consolidate onto email.2plot.dev instead of competing with it. -->
    <script>
    (function () {
        var CANONICAL_ORIGIN = '__CANONICAL_ORIGIN__';

        function update(selector, attr, value) {
            var el = document.head.querySelector(selector);
            if (el) { el.setAttribute(attr, value); }
        }

        function canonicalUrl() {
            var path = window.location.pathname || '/';
            // Collapse a trailing slash so /templates and /templates/ do not
            // become two indexed URLs. The root keeps its slash.
            if (path.length > 1 && path.charAt(path.length - 1) === '/') {
                path = path.slice(0, -1);
            }
            // Query strings and fragments are never part of the canonical.
            return CANONICAL_ORIGIN + path;
        }

        function sync() {
            var url = canonicalUrl();
            // Every one of these is emitted server-side; we only refresh them.
            update('link[rel="canonical"]', 'href', url);
            update('meta[property="og:url"]', 'content', url);
            update('meta[property="twitter:url"]', 'content', url);
        }

        // Dash routes client-side and fires no navigation event, so the only
        // reliable hook is patching the History API itself.
        ['pushState', 'replaceState'].forEach(function (name) {
            var original = history[name];
            history[name] = function () {
                var result = original.apply(this, arguments);
                sync();
                return result;
            };
        });
        window.addEventListener('popstate', sync);

        sync();
    })();
    </script>

    <!-- Structured data.
         SoftwareSourceCode, not SoftwareApplication: this describes an
         open-source library you import, not a hosted app you sign up for.
         Every value here is checked against the actual package — do not add
         ratings, prices or download counts that nothing measures. -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "SoftwareSourceCode",
                "name": "dash-email — email components for Dash",
                "description": "dash-email — 15 email-safe Plotly Dash components wrapping React Email patterns. Build, preview and send HTML emails from Python. By Pip Install Python.",
                "url": "__CANONICAL_ORIGIN__",
                "codeRepository": "https://github.com/pip-install-python/dash-email",
                "programmingLanguage": ["Python", "JavaScript"],
                "runtimePlatform": "Python 3.9+, Dash 4.1+",
                "license": "https://opensource.org/licenses/MIT",
                "author": {
                    "@type": "Organization",
                    "name": "Pip Install Python LLC",
                    "url": "https://pip-install-python.com"
                }
            },
            {
                "@type": "WebSite",
                "name": "dash-email — email components for Dash",
                "url": "__CANONICAL_ORIGIN__",
                "publisher": {
                    "@type": "Organization",
                    "name": "Pip Install Python LLC",
                    "url": "https://pip-install-python.com"
                }
            }
        ]
    }
    </script>

    <!-- LLM discovery -->
    <meta name="llms-txt" content="__CANONICAL_ORIGIN__/llms.txt">
    <meta name="llms-sitemap" content="__CANONICAL_ORIGIN__/sitemap.xml">

</head>
<body>
    {%app_entry%}
    <footer>
        {%config%}
        {%scripts%}
        {%renderer%}
    </footer>
    <noscript>
        <div style="max-width: 640px; margin: 40px auto; font-family: sans-serif;">
            <h1>dash-email — email components for Dash</h1>
            <p>
                15 email-safe Plotly Dash components wrapping React Email
                patterns, for building, previewing and sending HTML emails from
                Python. MIT licensed, Python 3.9+, Dash 4.1+.
                By Pip Install Python.
            </p>
            <!-- Deliberately does not lead with "requires JavaScript".
                 dash-improve-my-llms 2.3.3 prerenders real prose for
                 crawlers, so that framing is misleading for the readers most
                 likely to act on it. JS-disabled humans still get the links
                 below, which is the part that was ever useful.

                 Note this does NOT make the fleet runbook's
                 `grep -c "requires JavaScript"` return 0: the package emits
                 "Interactive version requires JavaScript." in its own
                 crawler-facing footer, so that check cannot reach 0 on 2.3.3
                 regardless of what this template says. -->
            <p>
                The interactive documentation renders in the browser. These
                machine-readable versions are always available:
            </p>
            <ul>
                <li><a href="/llms.txt"><strong>llms.txt</strong></a> — LLM-friendly documentation</li>
                <li><a href="/sitemap.xml"><strong>sitemap.xml</strong></a> — full site structure</li>
                <li><a href="/robots.txt"><strong>robots.txt</strong></a> — crawler instructions</li>
            </ul>
            <p>
                Source code: <a href="https://github.com/pip-install-python/dash-email">github.com/pip-install-python/dash-email</a>
                · Package: <a href="https://pypi.org/project/dash-email/">pypi.org/project/dash-email</a>
            </p>
        </div>
    </noscript>
</body>
</html>
