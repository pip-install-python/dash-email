name: CI

# Two things at once, because this repo is two things: a published component
# library AND the docs site at email.2plot.dev.
#
#   library   the smoke matrix across the supported Dash range, the wheel
#             build, and the Python range setup.py claims;
#   satellite the 2plot network baseline — a secretless pytest run, the real
#             Docker image booted and probed by the same battery that runs
#             against production, and version fingerprints asserted INSIDE the
#             artifact (pip metadata is invisible from outside a running host).
#
# Deliberately NOT `push: branches: [main]`. cd.yml runs on that push and its
# first job `uses:` this workflow, so a push to main would start two runs of it
# — which then contend for the `ci-${{ github.ref }}` concurrency group below
# and cancel each other. The work still gets done, but every push leaves a
# `cancelled` CI run next to the green CD one, which reads as a failure at a
# glance. So: pull requests get their own CI, and `main` is owned by CD. There
# is no coverage gap — CD cannot deploy without this workflow passing first.
on:
  pull_request:
  workflow_dispatch:
  # Called by cd.yml so a deploy can never ship something the matrix rejected.
  workflow_call:

# Read-only. Nothing here publishes, comments or tags; the deploy lives in
# cd.yml behind a `production` environment and the PyPI release in release.yml.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Never let a CI run inherit production behaviour: `require_owned_base_url()`
  # keys off RENDER / APP_ENV, and the satellite reporter keys off the webhook
  # secret. Both must stay inert here.
  APP_ENV: ci

# TWO different Python floors, and conflating them is the easy mistake:
#
#   * the PACKAGE needs >= 3.9 — `dash` itself requires 3.9, and that is what
#     `python_requires` in setup.py promises. Verified by the `package` and
#     `package-python-range` jobs, which install the wheel with nothing but
#     Dash.
#   * the DOCS SITE needs >= 3.10 — `python-frontmatter` 1.3 imports
#     `typing.TypeGuard`, which is 3.10+. Nothing we can do about it here, and
#     it does not constrain the package at all.
#
# So the smoke job never runs below 3.10, and the package jobs never install
# the docs requirements.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install flake8
      - name: flake8
        run: flake8 lib components pages tests scripts utils run.py

      # The workflows lint themselves. This is not belt-and-braces: an invalid
      # workflow file is the one defect CI structurally cannot report, because
      # the run dies before a job exists to fail. A double-quoted string inside
      # a ${{ }} expression is a LEX error that invalidates the whole file —
      # it silently killed every CI and CD run on boilerplate.2plot.dev for
      # four days, with nothing to click and nothing in the API but
      # `conclusion: failure` and zero jobs. actionlint catches it in a second.
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  docs-tests:
    name: Docs site · pytest (zero secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install the docs site
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # markdown2dash pins gunicorn<22 against the CVE-driven gunicorn>=23
          # floor. Same two-command install as the Dockerfile, release.yml and
          # scripts/compat_matrix.py.
          pip install --no-deps markdown2dash==0.1.2
          pip install -e .
          pip install pytest

      - name: Confirm the pinned dependency versions
        run: |
          python - <<'PY'
          import dash, dash_improve_my_llms as pkg, gunicorn

          def parts(v):
              return tuple(int(x) for x in v.split(".")[:3] if x.isdigit())

          assert parts(dash.__version__)[:2] >= (4, 1), dash.__version__
          # 2.8.0 is the ledger floor (item 12): ONE classifier (`classify()`)
          # and the READ EVENT (`on_document_read`) the ledger's `reads`
          # table and rollup v4's vendors[] depend on. Underneath, 2.7.1 is
          # the round-3 fleet floor: 2.7.0 dedups the prerender H1 and the
          # home footer's doubled /llms.txt link and hardens the idempotency
          # probe (the marker-in-comment trap); 2.7.1 adds the llms.txt v2
          # discovery relations, the text/plain Accept ramp and the
          # representation digest. Further underneath, 2.6.1 keeps the
          # prerender VISIBLE, 2.6.0 keeps sitemap lastmod honored, and 2.3.4
          # is where `resolve_site_title` appeared. Same number as
          # requirements.txt and run.py's boot floor — grep it, don't move
          # one.
          assert parts(pkg.__version__) >= (2, 8, 0), pkg.__version__
          # 21.x carried two request-smuggling CVEs (CVE-2024-6827,
          # CVE-2024-1135). markdown2dash's spurious <22 pin must not win.
          assert parts(gunicorn.__version__)[:2] >= (23, 0), gunicorn.__version__
          print(f"dash {dash.__version__}, dash-improve-my-llms "
                f"{pkg.__version__}, gunicorn {gunicorn.__version__}")
          PY

      # No CROSS_APP_WEBHOOK_SECRET, no GOOGLE_API_KEY, no RESEND_API_KEY here
      # ON PURPOSE. tests/conftest.py pins them empty, and the app's degraded
      # postures (showcase mode, a dormant reporter) are only provable when
      # nothing is configured.
      - name: Test suite (zero secrets)
        run: pytest tests -q

      - name: Boot under a production server
        run: |
          gunicorn run:server -b 127.0.0.1:8054 --daemon --access-logfile - --error-logfile -
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8054/healthz && break
            sleep 1
          done
          # A page that renders under the test client can still fail under a
          # real WSGI worker — different import path, different working
          # directory, no test-client conveniences.
          curl -sf http://127.0.0.1:8054/ > /dev/null
          curl -sf http://127.0.0.1:8054/components/email-structure > /dev/null
          # The battery, against the same server this satellite deploys.
          python3 scripts/network_smoke.py --base-url http://127.0.0.1:8054

  docker:
    name: docker image · boot · battery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [docs-tests]
    steps:
      - uses: actions/checkout@v7

      # The same build Render runs. This is where a dependency-resolution
      # failure surfaces — at CI time, not deploy time, where the only signal
      # is a dashboard log while the old image keeps serving.
      - uses: docker/setup-buildx-action@v4
      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: dash-email-docs:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # pip metadata is invisible from outside a running host, so the versions
      # are asserted here, inside the artifact that actually ships.
      - name: Version fingerprints inside the image
        run: |
          docker run --rm dash-email-docs:ci python -c "
          from importlib.metadata import version

          def parts(v):
              return tuple(int(x) for x in v.split('.')[:3] if x.isdigit())

          v = version('dash')
          print('dash', v)
          assert parts(v)[:2] >= (4, 1), f'expected dash >=4.1, image has {v}'

          v = version('dash-improve-my-llms')
          print('dash-improve-my-llms', v)
          assert parts(v) >= (2, 8, 0), f'expected >=2.8.0 (classify()/on_document_read ledger floor), image has {v}'

          # The vendored Clerk stack, asserted INSIDE the artifact. The
          # import matters as much as the version: a vendor/ directory that
          # resolved empty at build time installs nothing, silently — pip
          # only soft-warns before dying on an OSError that reads like a
          # registry outage (the emojimart image failure, batch 1).
          v = version('dash-clerk-auth')
          print('dash-clerk-auth', v)
          assert v == '1.0.5', f'expected vendored 1.0.5, image has {v}'
          import dash_clerk_auth  # noqa: F401
          print('dash_clerk_auth importable')
          v = version('clerk-backend-api')
          print('clerk-backend-api', v)
          assert parts(v) >= (7, 0), f'expected >=7 (cryptography floor room), image has {v}'
          v = version('cryptography')
          print('cryptography', v)
          assert parts(v) >= (50, 0), f'expected >=50 (four advisories), image has {v}'

          # markdown2dash installs with --no-deps to dodge its gunicorn<22
          # pin; this assert is what proves the dodge kept working. 21.x
          # carried two request-smuggling CVEs (CVE-2024-6827, CVE-2024-1135).
          v = version('gunicorn')
          print('gunicorn', v)
          assert parts(v)[:2] >= (23, 0), f'expected gunicorn>=23, image has {v}'

          # ...and that skipping its dependency graph did not skip the package.
          import markdown2dash  # noqa: F401
          print('markdown2dash importable')
          "

      # Boot with no secrets: the email builder falls back to showcase mode,
      # the traffic reporter stays dormant. What this catches is any
      # import-time or preload crash — the class of failure where the platform
      # loops the worker and the deploy never goes live.
      - name: Boot the container and wait for /healthz
        run: |
          docker run -d --name docs -p 8054:8054 dash-email-docs:ci
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8054/healthz > /dev/null; then
              echo "healthy after ~$((i*2))s"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' docs)" != "true" ]; then
              echo "container exited during boot:"
              docker logs docs
              exit 1
            fi
            sleep 2
          done
          echo "never became healthy; last logs:"
          docker logs --tail 100 docs
          exit 1

      # The SAME script CD runs against https://email.2plot.dev, so a failure
      # in CI and a failure in production read identically.
      - name: Smoke battery against the booted container
        run: python3 scripts/network_smoke.py --base-url http://127.0.0.1:8054

      # The guard on the guard (emojimart's F2 finding, 2026-08-24): the
      # boot step curls /healthz from OUTSIDE, which proves the app binds
      # and answers — but says nothing about the Dockerfile's HEALTHCHECK
      # instruction itself. A broken probe (wrong port, missing binary,
      # bad quoting) ships silently while every external check stays
      # green, and the orchestrator that relies on container health sees
      # an opaque box. Poll Docker's own verdict: with --interval=30s and
      # --start-period=20s the first probe lands within ~50s.
      - name: Assert Docker's own health verdict
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' docs 2>/dev/null || echo none)"
            if [ "$status" = "healthy" ]; then
              echo "docker reports healthy after ~$((i*3))s"
              exit 0
            fi
            if [ "$status" = "none" ]; then
              echo "image has NO HEALTHCHECK — the container is opaque to its orchestrator"
              exit 1
            fi
            sleep 3
          done
          echo "HEALTHCHECK never reported healthy (last: $status) — the probe itself is broken:"
          docker inspect -f '{{json .State.Health}}' docs || true
          exit 1

      - name: Container logs (for the record)
        if: always()
        run: docker logs --tail 40 docs 2>/dev/null || true

  smoke:
    name: Docs · Dash ${{ matrix.dash }} · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The current release on the fleet Python (sync item 5, template
        # 1.6.27) — the same minor the Dockerfile's FROM tag declares, which
        # the old matrix never exercised: main said 3.12 while the image
        # served whatever pip resolved at build time.
        # tests/test_python_version.py pins the two together.
        dash: ["4.4.1"]
        python: ["3.14"]
        include:
          # ...the two adjacent minors keep the compat window three wide on
          # the current Dash...
          - dash: "4.4.1"
            python: "3.13"
          - dash: "4.4.1"
            python: "3.12"
          # ...and the supported Dash range — the 4.1 floor and the two
          # intermediate minors — stays on a window leg (3.12), not the
          # main: each include row varies ONE axis (these vary dash, the
          # rows above vary python), so a red always names its cause. A
          # full cross-product would be 12 jobs for very little extra
          # signal.
          - dash: "4.1.0"
            python: "3.12"
          - dash: "4.2.0"
            python: "3.12"
          - dash: "4.3.0"
            python: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # node is what makes the JS syntax checks real. Without it the smoke
      # test skips them rather than failing, so a broken clientside_callback
      # or a truncated component bundle would sail through.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Dash ${{ matrix.dash }} first
        # Install the version under test BEFORE the rest, so the other
        # requirements resolve against it rather than dragging in a newer Dash.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dash==${{ matrix.dash }}"

      - name: Install documentation-site requirements
        # The pinned Dash line is stripped so it cannot override the matrix
        # version. Same rule as scripts/compat_matrix.py.
        run: |
          grep -v 'COMPAT-MATRIX: dash' requirements.txt > /tmp/reqs.txt
          python -m pip install -r /tmp/reqs.txt
          # markdown2dash pins gunicorn<22 against the CVE-driven gunicorn>=23
          # floor, so it is not in requirements.txt and installs without its
          # dependency graph. Same pair as the Dockerfile and release.yml.
          python -m pip install --no-deps markdown2dash==0.1.2

      - name: Report the resolved Dash version
        # A silent upgrade here would make the whole matrix meaningless.
        run: |
          RESOLVED=$(python -c "import dash; print(dash.__version__)")
          echo "requested=${{ matrix.dash }} resolved=$RESOLVED"
          if [ "$RESOLVED" != "${{ matrix.dash }}" ]; then
            echo "::warning::Dash resolved to $RESOLVED, not ${{ matrix.dash }}"
          fi

      - name: Smoke test
        run: python scripts/smoke_test.py --json smoke-${{ matrix.dash }}-py${{ matrix.python }}.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ matrix.dash }}-py${{ matrix.python }}
          path: smoke-*.json
          if-no-files-found: ignore

  package:
    name: Build + verify the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check_release.py compares the git commit times of the bundle and
          # src/lib/components. A shallow clone can omit the commit that last
          # touched one of them, which turns the check into a false
          # "no git history" skip.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Release consistency
        # Version drift across package.json / dash_email/package.json /
        # lib/constants.py, a stale bundle, packaging drift. None of these
        # break a test run.
        run: python scripts/check_release.py

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Install the wheel in a clean venv and import it
        # The package must work with ONLY `dash` present — nothing from
        # requirements.txt, which is the docs site's dependency set.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python - <<'PY'
          import pathlib

          import dash_email as de

          print("version:", de.__version__)

          bundle = pathlib.Path(de.__file__).parent / "dash_email.min.js"
          assert bundle.exists(), "JS bundle missing from the wheel"
          print("bundle:", bundle.stat().st_size // 1024, "KB")

          expected = [
              "Email", "EmailHead", "EmailPreview", "EmailBody",
              "EmailContainer", "EmailSection", "EmailRow", "EmailColumn",
              "EmailHeading", "EmailText", "EmailButton", "EmailLink",
              "EmailImage", "EmailDivider", "EmailFont",
          ]
          for name in expected:
              assert hasattr(de, name), f"missing component: {name}"
          assert sorted(de.__all__) == sorted(expected), (
              f"__all__ drift: {sorted(set(de.__all__) ^ set(expected))}"
          )
          print(f"components OK ({len(expected)})")

          # The wheel must carry the library and nothing else. `lib`, `pages`,
          # `components` and `docs` are docs-site directories that a careless
          # `find_packages()` would happily install as top-level packages.
          from importlib.metadata import distribution

          top = (distribution("dash_email").read_text("top_level.txt") or "").split()
          assert top == ["dash_email"], f"wheel installs more than the library: {top}"
          print("top_level.txt:", top)
          PY

      - name: Assert the wheel version matches package.json
        run: |
          PY_VER=$(python -c "import json;print(json.load(open('package.json'))['version'])")
          WHEEL_VER=$(/tmp/clean/bin/python -c "import dash_email;print(dash_email.__version__)")
          echo "package.json=$PY_VER  installed=$WHEEL_VER"
          test "$PY_VER" = "$WHEEL_VER"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  package-python-range:
    name: Package · Python ${{ matrix.python }}
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every interpreter `python_requires` in setup.py claims. This is what
        # makes that claim measured rather than asserted — and it installs
        # ONLY the wheel plus Dash, never the docs requirements, because the
        # package's floor is not the docs site's.
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install the wheel (pulls in dash, nothing else)
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Import and build an email layout
        run: |
          python - <<'PY'
          import dash, dash_email as de
          from dash import Dash
          from dash._utils import to_json

          app = Dash(__name__)
          app.layout = de.Email(lang="en", children=[
              de.EmailHead([de.EmailFont(fontFamily="Inter",
                                         fallbackFontFamily="Helvetica")]),
              de.EmailPreview("Your order shipped"),
              de.EmailBody(style={"backgroundColor": "#f6f9fc"}, children=[
                  de.EmailContainer([
                      de.EmailSection([
                          de.EmailHeading("Welcome", as_="h1"),
                          de.EmailText("Thanks for signing up."),
                          de.EmailImage(src="https://example.com/a.png",
                                        alt="a", width=120, height=40),
                          de.EmailDivider(),
                          de.EmailRow([
                              de.EmailColumn(style={"width": "70%"},
                                             children=[de.EmailText("Product")]),
                              de.EmailColumn(style={"width": "30%"},
                                             children=[de.EmailText("$99.00")]),
                          ]),
                          de.EmailButton("Get Started", href="https://example.com"),
                          de.EmailLink("or read more", href="https://example.com"),
                      ]),
                  ]),
              ]),
          ])
          to_json(app.layout)
          print(f"dash={dash.__version__} dash_email={de.__version__} "
                f"components={len(de.__all__)} OK")
          PY

  lint-js:
    name: JS sources parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # The committed bundle is what users actually load, and it is a build
      # artifact nobody reviews line by line. Parsing it here is the cheapest
      # guard against committing a truncated or half-written build.
      - name: Parse the committed component bundle
        run: node --check dash_email/dash_email.min.js
      - name: Parse assets/*.js individually and concatenated
        run: |
          for f in assets/*.js; do node --check "$f"; done
          cat assets/*.js | node --check -

  pip-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory on purpose. A CVE in a transitive dependency of a docs site is
    # worth knowing about the day it lands, and worth nobody's broken build at
    # 2am. The report is the value; flip this off once the baseline is quiet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --skip-editable
