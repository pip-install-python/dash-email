name: CI

# Every push and PR runs the smoke suite against the full supported Dash range.
# setup.py declares `dash>=4.1`; this is what keeps that claim honest, and it
# is the same harness scripts/compat_matrix.py runs locally.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# TWO different Python floors, and conflating them is the easy mistake:
#
#   * the PACKAGE needs >= 3.9 — `dash` itself requires 3.9, and that is what
#     `python_requires` in setup.py promises. Verified by the `package` and
#     `package-python-range` jobs, which install the wheel with nothing but
#     Dash.
#   * the DOCS SITE needs >= 3.10 — `python-frontmatter` 1.3 imports
#     `typing.TypeGuard`, which is 3.10+. Nothing we can do about it here, and
#     it does not constrain the package at all.
#
# So the smoke job never runs below 3.10, and the package jobs never install
# the docs requirements.
jobs:
  smoke:
    name: Docs · Dash ${{ matrix.dash }} · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor, the two intermediate minors, and the current release.
        dash: ["4.1.0", "4.2.0", "4.3.0", "4.4.1"]
        python: ["3.12"]
        include:
          # The docs-site Python range, against the current Dash. A full
          # cross-product would be 12 jobs for very little extra signal.
          - dash: "4.4.1"
            python: "3.10"
          - dash: "4.4.1"
            python: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # node is what makes the JS syntax checks real. Without it the smoke
      # test skips them rather than failing, so a broken clientside_callback
      # or a truncated component bundle would sail through.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dash ${{ matrix.dash }} first
        # Install the version under test BEFORE the rest, so the other
        # requirements resolve against it rather than dragging in a newer Dash.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dash==${{ matrix.dash }}"

      - name: Install documentation-site requirements
        # The pinned Dash line is stripped so it cannot override the matrix
        # version. Same rule as scripts/compat_matrix.py.
        run: |
          grep -v 'COMPAT-MATRIX: dash' requirements.txt > /tmp/reqs.txt
          python -m pip install -r /tmp/reqs.txt

      - name: Report the resolved Dash version
        # A silent upgrade here would make the whole matrix meaningless.
        run: |
          RESOLVED=$(python -c "import dash; print(dash.__version__)")
          echo "requested=${{ matrix.dash }} resolved=$RESOLVED"
          if [ "$RESOLVED" != "${{ matrix.dash }}" ]; then
            echo "::warning::Dash resolved to $RESOLVED, not ${{ matrix.dash }}"
          fi

      - name: Smoke test
        run: python scripts/smoke_test.py --json smoke-${{ matrix.dash }}-py${{ matrix.python }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.dash }}-py${{ matrix.python }}
          path: smoke-*.json
          if-no-files-found: ignore

  package:
    name: Build + verify the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check_release.py compares the git commit times of the bundle and
          # src/lib/components. A shallow clone can omit the commit that last
          # touched one of them, which turns the check into a false
          # "no git history" skip.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Release consistency
        # Version drift across package.json / dash_email/package.json /
        # lib/constants.py, a stale bundle, packaging drift. None of these
        # break a test run.
        run: python scripts/check_release.py

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Install the wheel in a clean venv and import it
        # The package must work with ONLY `dash` present — nothing from
        # requirements.txt, which is the docs site's dependency set.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python - <<'PY'
          import pathlib

          import dash_email as de

          print("version:", de.__version__)

          bundle = pathlib.Path(de.__file__).parent / "dash_email.min.js"
          assert bundle.exists(), "JS bundle missing from the wheel"
          print("bundle:", bundle.stat().st_size // 1024, "KB")

          expected = [
              "Email", "EmailHead", "EmailPreview", "EmailBody",
              "EmailContainer", "EmailSection", "EmailRow", "EmailColumn",
              "EmailHeading", "EmailText", "EmailButton", "EmailLink",
              "EmailImage", "EmailDivider", "EmailFont",
          ]
          for name in expected:
              assert hasattr(de, name), f"missing component: {name}"
          assert sorted(de.__all__) == sorted(expected), (
              f"__all__ drift: {sorted(set(de.__all__) ^ set(expected))}"
          )
          print(f"components OK ({len(expected)})")

          # The wheel must carry the library and nothing else. `lib`, `pages`,
          # `components` and `docs` are docs-site directories that a careless
          # `find_packages()` would happily install as top-level packages.
          from importlib.metadata import distribution

          top = (distribution("dash_email").read_text("top_level.txt") or "").split()
          assert top == ["dash_email"], f"wheel installs more than the library: {top}"
          print("top_level.txt:", top)
          PY

      - name: Assert the wheel version matches package.json
        run: |
          PY_VER=$(python -c "import json;print(json.load(open('package.json'))['version'])")
          WHEEL_VER=$(/tmp/clean/bin/python -c "import dash_email;print(dash_email.__version__)")
          echo "package.json=$PY_VER  installed=$WHEEL_VER"
          test "$PY_VER" = "$WHEEL_VER"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  package-python-range:
    name: Package · Python ${{ matrix.python }}
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every interpreter `python_requires` in setup.py claims. This is what
        # makes that claim measured rather than asserted — and it installs
        # ONLY the wheel plus Dash, never the docs requirements, because the
        # package's floor is not the docs site's.
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install the wheel (pulls in dash, nothing else)
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Import and build an email layout
        run: |
          python - <<'PY'
          import dash, dash_email as de
          from dash import Dash
          from dash._utils import to_json

          app = Dash(__name__)
          app.layout = de.Email(lang="en", children=[
              de.EmailHead([de.EmailFont(fontFamily="Inter",
                                         fallbackFontFamily="Helvetica")]),
              de.EmailPreview("Your order shipped"),
              de.EmailBody(style={"backgroundColor": "#f6f9fc"}, children=[
                  de.EmailContainer([
                      de.EmailSection([
                          de.EmailHeading("Welcome", as_="h1"),
                          de.EmailText("Thanks for signing up."),
                          de.EmailImage(src="https://example.com/a.png",
                                        alt="a", width=120, height=40),
                          de.EmailDivider(),
                          de.EmailRow([
                              de.EmailColumn(style={"width": "70%"},
                                             children=[de.EmailText("Product")]),
                              de.EmailColumn(style={"width": "30%"},
                                             children=[de.EmailText("$99.00")]),
                          ]),
                          de.EmailButton("Get Started", href="https://example.com"),
                          de.EmailLink("or read more", href="https://example.com"),
                      ]),
                  ]),
              ]),
          ])
          to_json(app.layout)
          print(f"dash={dash.__version__} dash_email={de.__version__} "
                f"components={len(de.__all__)} OK")
          PY

  lint-js:
    name: JS sources parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The committed bundle is what users actually load, and it is a build
      # artifact nobody reviews line by line. Parsing it here is the cheapest
      # guard against committing a truncated or half-written build.
      - name: Parse the committed component bundle
        run: node --check dash_email/dash_email.min.js
      - name: Parse assets/*.js individually and concatenated
        run: |
          for f in assets/*.js; do node --check "$f"; done
          cat assets/*.js | node --check -
