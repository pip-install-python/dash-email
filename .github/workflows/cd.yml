name: CD

# Deploys email.2plot.dev, then checks the live site.
#
# THE ROAD (sync item 13, 1.6.35): Render auto-deploys the `release` branch,
# and ONLY this workflow writes `release` — a fast-forward push of the run's
# own sha, after the CI matrix is green. A push to `main` is therefore not a
# deploy; it is a candidate. This fork ran hookless-autoDeploy-from-main
# before this change (the deliberate choice recorded in DIVERGENCES.md's
# retired entry 2) — the same defect class the template measured
# (2026-08-29, de0bcff: a red build served live for minutes because Render
# watched the same branch CI was still judging) applied here too, since main
# was also what Render auto-deployed. Now it watches a branch that only ever
# holds certified commits.
#
# The Render deploy-hook step is GONE from this file; the secret it read is
# inert and safe to delete — its name is deliberately not spelled here,
# because sync item 13's detect greps this file for it. `main` ahead of
# `release` means an uncertified push is pending (its run red or running) —
# never "drift", never a reason to deploy by hand (kit trap).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: Site to verify (skips the deploy when set to another host)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SITE_URL: ${{ inputs.target_url || 'https://email.2plot.dev' }}

jobs:
  test:
    name: ci
    uses: ./.github/workflows/ci.yml

  deploy:
    name: promote to release
    needs: [test]
    runs-on: ubuntu-latest
    # Long enough for the build-match wait below (up to 100 × 15s) and no
    # longer. Without it the job inherits GitHub's six-hour default, which
    # is how a platform that never comes back healthy holds the
    # `cd-production` concurrency group all day.
    timeout-minutes: 30
    environment:
      name: production
      url: https://email.2plot.dev
    # `contents: write` on THIS job only — it is the one thing in the
    # workflow that writes to the repository (the `release` ref). The
    # workflow-level grant above stays `read`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # FULL history, not the default depth-1 shallow clone. A shallow
          # HEAD pushed onto an EXISTING `release` is rejected as
          # non-fast-forward ("fetch first") because the clone cannot show
          # the remote that release's tip is an ancestor. A fork's first
          # promote succeeds regardless — it creates the branch — so this
          # will not bite until the second push. Reproduced locally:
          # depth-1 rejected, `--unshallow` lands.
          fetch-depth: 0

      - name: Promote to release
        # Only a push to main promotes. A workflow_dispatch that names
        # another host (target_url) is a verify-only run against that host
        # and must not move this repo's release ref. (The hook step this
        # replaced had no such guard; the wait below never did either, and
        # still spins against whatever SITE_URL says.)
        if: github.event_name == 'push' || inputs.target_url == ''
        run: |
          # Fast-forward push of the run's own sha. `needs: [test]` is the
          # gate: a red matrix never reaches this step, so `release` cannot
          # receive an uncertified commit by construction. On the FIRST run
          # `release` does not exist yet and this push creates it.
          #
          # If this push is rejected with the whole matrix green, the REPO's
          # Actions default workflow permission is read-only and caps the
          # job-level `contents: write` above: Settings → Actions → General
          # → Workflow permissions → "Read and write", then re-run failed
          # jobs. Never a PAT, never --force (sync item 13; measured on
          # muischeduler's first promote).
          #
          # NOT --force, on purpose: a non-fast-forward means somebody wrote
          # `release` by hand (a rollback, a hotfix). This job then FAILS
          # and says so; a force here would silently undo that person.
          #
          # GITHUB_TOKEN pushes trigger no workflows — correct: `on:` is
          # main-only, and it is Render, not Actions, that reacts to
          # `release` (render.yaml `branch: release`, autoDeploy on).
          git push origin "HEAD:refs/heads/release"
          echo "::notice::release → ${GITHUB_SHA} (fast-forward)"

      - name: Wait for THIS build to serve traffic
        # Render deploys `release`, which the step above just set to this
        # run's sha, so the wait is unchanged (item 13 leaves it as-is):
        # hold until /healthz reports THIS build. The old shape (before
        # 2026-08-21) skipped this wait and ran the battery three seconds
        # later against the PREVIOUS release; that defect was invisible for
        # the workflow's whole life until a new surface made the race lose
        # — found on muicharts, fleet-wide class.
        if: github.event_name == 'push' || inputs.target_url == ''
        run: |
          # A bare 200 proves nothing about WHICH build answered: /healthz
          # now reports the running instance's commit (RENDER_GIT_COMMIT),
          # and this loop holds until it equals the SHA that triggered this
          # run. Fallback: a build that predates the field gets the old
          # sustained-health wait, with a warning naming what it can't tell
          # — that fallback fires exactly once, on the deploy carrying the
          # field for the first time.
          # 100 × 15s = 25 min, sized for the WORST build, not the typical
          # one: a dependency-floor bump busts the Docker cache by design
          # (the requirements.txt line changing IS the bust), so the deploy
          # this pipeline most exists to verify is also Render's slowest
          # full rebuild. The 2.7.1 floor round timed out the old 15-min
          # window on exactly that deploy (2026-08-24).
          want="${GITHUB_SHA}"
          matched=0
          ok=0
          for _ in $(seq 1 100); do
            body="$(curl -fsS "$SITE_URL/healthz" 2>/dev/null || true)"
            if [ -n "$body" ]; then
              build="$(printf '%s' "$body" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("build",""))' 2>/dev/null || true)"
              if [ "$build" = "$want" ]; then
                matched=$((matched + 1))
                [ "$matched" -ge 3 ] && break
              elif [ -z "$build" ]; then
                ok=$((ok + 1))
              fi
            fi
            sleep 15
          done
          if [ "$matched" -ge 3 ]; then
            echo "::notice::live /healthz reports build $want — verifying the artifact this run shipped."
          elif [ "$ok" -ge 5 ]; then
            echo "::warning::live /healthz predates the build field — cannot prove WHICH build is serving; verified sustained health only. This warning should appear exactly once."
          else
            echo "::error::$SITE_URL never served this run's build ($want) and never became reliably healthy"
            exit 1
          fi

  verify:
    name: verify the live site
    needs: [deploy]
    # ONLY after a successful deploy (item 13): the old
    # `!= 'cancelled' && != 'skipped'` also admitted 'failure' — a promote
    # step that failed still let this job run and report GREEN against
    # whatever build was already live. A verify that passes when nothing
    # deployed must not exist.
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The fleet Python (site lane) — tests/test_python_version.py holds
          # this literal to the Dockerfile's FROM minor.
          python-version: "3.14"

      - name: The live build IS this run's sha
        # Belt to the `if:` above, and stronger: it also catches a promote
        # that succeeded while Render's build did not, or a later run that
        # promoted past us between deploy and verify. Skipped on a
        # workflow_dispatch against another host (its shas are not ours).
        if: github.event_name == 'push' || inputs.target_url == ''
        run: |
          build="$(curl -fsS "$SITE_URL/healthz" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("build",""))')"
          if [ "$build" != "$GITHUB_SHA" ]; then
            echo "::error::verify refuses: $SITE_URL serves build '${build:-<none>}', this run is $GITHUB_SHA — nothing this run shipped is on the wire to verify"
            exit 1
          fi
          echo "::notice::verifying build $build (this run's sha)"

      # The network battery first: it is the same script, with the same check
      # names, that CI ran against the container this deploy shipped. A name
      # that passed in CI and fails here isolates the fault to the deploy.
      - name: Network smoke battery
        run: python scripts/network_smoke.py --base-url "$SITE_URL"

      # Then the satellite-specific checks the battery does not make: every
      # canonical, every crawler body, the social card's real pixels, and every
      # peer llms.txt in the directory actually resolving.
      - name: Smoke-test the deployment
        run: python scripts/smoke_live.py "$SITE_URL"

      - name: Report
        if: failure()
        run: |
          echo "::error::Live verification failed for $SITE_URL. Every failure these check for is silent in production: a site identity that fell back to a framework default, a stale dash-improve-my-llms artifact, a canonical on the wrong host, a page serving the JavaScript stub, a blank or reshaped social card, a missing network directory, and dead peer llms.txt links."
